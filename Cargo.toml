[package]
name = "policy-rs"
version = "1.8.1"
edition = "2024"
description = "Policy library for working with protobuf-defined policy objects"
license = "Apache-2.0"
repository = "https://github.com/usetero/policy-rs"
homepage = "https://github.com/usetero/policy-rs"
documentation = "https://docs.rs/policy-rs"
readme = "README.md"
keywords = ["policy", "telemetry", "observability", "otel"]
categories = ["development-tools"]

[lib]
doctest = false

[features]
default = []
# TLS root sources are chosen by the consumer, not forced here: reqwest's
# `rustls-tls` implies webpki roots, which a FIPS build cannot subtract because
# Cargo unifies features additively. `http` keeps the standalone default; a
# consumer that supplies its own roots (and crypto provider) takes
# `http-no-roots` and adds one of the root features, or reqwest's own.
http = ["http-no-roots", "webpki-roots"]
http-no-roots = ["reqwest"]
webpki-roots = ["reqwest/rustls-tls-webpki-roots"]
native-roots = ["reqwest/rustls-tls-native-roots"]
grpc = ["tonic"]

[dependencies]
vectorscan-rs-sys = "0.0.6"
prost = "0.13"
fnv = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls-manual-roots-no-provider"], optional = true, default-features = false }
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pbjson = "0.9"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tonic = { version = "0.12", optional = true }

[dev-dependencies]
criterion = { version = "=0.8.2", features = ["async_tokio"] }
dotenvy = "=0.15.7"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt", "rt-multi-thread", "macros"] }

[[bench]]
name = "engine"
harness = false

[[example]]
name = "http_provider"
required-features = ["http"]

[[example]]
name = "grpc_provider"
required-features = ["grpc"]

[build-dependencies]
pbjson-build = "0.9"
prost-build = "0.13"
tonic-build = "0.12"
