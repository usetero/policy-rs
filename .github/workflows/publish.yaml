---
# Publish to crates.io Workflow
#
# Why this exists:
# Automates publishing the crate to crates.io when a GitHub release is created.
#
# What it does:
# - Triggers when a GitHub release is published
# - Uses OIDC Trusted Publishing to authenticate with crates.io
# - Publishes to crates.io
#
# Requirements:
# - Trusted Publishing must be configured on crates.io for this repository
#   See: https://doc.rust-lang.org/cargo/reference/registry-authentication.html#trusted-publishing
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # 1.1.5

      - name: Setup CI dependencies
        run: task ci:setup

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Verify version
        run: grep '^version' Cargo.toml

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
